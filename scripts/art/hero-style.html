<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人物風格比較</title>
<style>
  :root{--bg:#0c0e14;--card:#161924;--ink:#e9ecf3;--mute:#8a90a3}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding:16px}
  h1{font-size:18px;margin:0 0 4px} p{margin:0 0 12px;color:var(--mute)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:1260px}
  .col{background:var(--card);border-radius:14px;padding:10px 10px 6px}
  .col h2{font-size:15px;margin:2px 4px 0} .col small{display:block;color:var(--mute);margin:0 4px 6px}
  .poses{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .poses svg{width:100%;height:auto;background:radial-gradient(ellipse at 50% 85%,#263049 0,#161924 62%);border-radius:10px}
  .tiny{display:flex;gap:8px;align-items:end;margin-top:8px;padding:6px;background:#10121a;border-radius:10px}
  .tiny svg{height:64px;width:auto} .gray{filter:grayscale(1)}
  .tiny span{color:var(--mute);font-size:11px;align-self:center}
</style></head><body>
<h1>人物畫法：三種方向</h1>
<p>同一套關節角度（moves.js 格式），只換比例、肌肉、上色。下方小圖是 64px 與灰階測試。</p>
<div class="grid" id="grid"></div>
<script>
// ───────── 向量小工具 ─────────
const R = Math.PI / 180;
const dir = (a) => [Math.cos(a * R), Math.sin(a * R)];
const add = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const len = (a) => Math.hypot(a[0], a[1]);
const nrm = (a) => { const l = len(a) || 1; return [a[0] / l, a[1] / l]; };
const perp = (d) => [-d[1], d[0]];
const f = (n) => +n.toFixed(2);

// Catmull-Rom → 三次貝茲，閉合曲線
function smooth(pts, closed = true, k = 1 / 6) {
  const n = pts.length, P = (i) => pts[closed ? (i + n) % n : Math.max(0, Math.min(n - 1, i))];
  let d = `M${f(pts[0][0])},${f(pts[0][1])}`;
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    const c1 = [p1[0] + (p2[0] - p0[0]) * k, p1[1] + (p2[1] - p0[1]) * k];
    const c2 = [p2[0] - (p3[0] - p1[0]) * k, p2[1] - (p3[1] - p1[1]) * k];
    d += `C${f(c1[0])},${f(c1[1])} ${f(c2[0])},${f(c2[1])} ${f(p2[0])},${f(p2[1])}`;
  }
  return d + (closed ? 'Z' : '');
}
const poly = (pts) => 'M' + pts.map((p) => `${f(p[0])},${f(p[1])}`).join('L') + 'Z';

// 顏色：陰影往冷色偏，不只是變暗
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const shadowOf = (c, k) => mix(c, '#2a1f55', k);

// ───────── 肢段外形（肌肉剖面） ─────────
// prof: [t, n 側寬, 另一側寬]；n = 肢段方向轉 90°。直立時 n 指向背後。
function limb(a, b, prof, ws) {
  const d = nrm(sub(b, a)), n = perp(d), L = len(sub(b, a));
  const left = [], right = [];
  for (const [t, wn, wm] of prof) {
    const p = add(a, sub(b, a), t);
    left.push(add(p, n, wn * ws)); right.push(add(p, n, -wm * ws));
  }
  const e = prof[prof.length - 1], s = prof[0];
  return smooth([...left, add(b, d, (e[1] + e[2]) * ws * 0.32), ...right.reverse(), add(a, d, -(s[1] + s[2]) * ws * 0.28)]);
}
const PROF = {
  thigh: [[0, 9, 10], [0.3, 9.5, 12], [0.65, 8.3, 10.5], [1, 6.5, 7]],
  shin: [[0, 7, 7], [0.25, 10, 6.5], [0.55, 8, 5.5], [1, 4.6, 4.6]],
  upper: [[0, 7, 7], [0.45, 7, 8], [1, 5, 5.2]],
  fore: [[0, 5.5, 5.5], [0.22, 6.6, 6.2], [1, 4.2, 4]],
};

// ───────── 骨架（角度同 moves.js） ─────────
function skeleton(s, V) {
  const L = V.L, wf = V.wf;
  const hip = [0, 0], d = dir(s.torso), v = perp(d); // v：軀幹的「前面」
  const sh = add(hip, d, L.torso);
  const P = { hip, sh, d, v };
  P.nsh = add(add(sh, d, -5), v, -5);
  P.fsh = add(add(sh, d, -3), v, 15 * wf);
  P.nhip = add(hip, v, -1.5);
  P.fhip = add(add(hip, v, 5 * wf), d, -1.2);
  P.head = add(sh, dir(s.neck ?? s.torso), L.neck + V.r * 0.82);
  P.headAng = (s.neck ?? s.torso) + 90;
  const arm = (o, a) => { const e = add(o, dir(a[0]), L.upper); return [e, add(e, dir(a[1]), L.fore)]; };
  const leg = (o, a) => { const k = add(o, dir(a[0]), L.thigh), n = add(k, dir(a[1]), L.shin); return [k, n, add(n, dir(a[2] ?? 5), L.foot)]; };
  [P.nel, P.nha] = arm(P.nsh, s.arm); [P.fel, P.fha] = arm(P.fsh, s.farArm || s.arm);
  [P.nkn, P.nan, P.nto] = leg(P.nhip, s.leg); [P.fkn, P.fan, P.fto] = leg(P.fhip, s.farLeg || s.leg);
  P.footAng = s.leg[2] ?? 5; P.farFootAng = (s.farLeg || s.leg)[2] ?? 5;
  // 腳踩地：近側腳踝放到 (100,180)
  const off = sub([100, 180], P.nan);
  for (const k in P) if (Array.isArray(P[k]) && P[k].length === 2 && typeof P[k][0] === 'number' && !['d', 'v'].includes(k)) P[k] = add(P[k], off);
  return P;
}

// ───────── 繪製 ─────────
let uid = 0;
function makeRenderer(V) {
  const back = [], parts = [];
  const lw = V.lw, ink = V.ink;
  // 一個上色區塊：陰影底 → 受光面（往光源錯開）→ 邊緣光 → 描邊
  function part(d, base, o = {}) {
    const id = 'c' + uid++, dark = o.far ? 0.3 : 0;
    const b = dark ? mix(base, '#1a1530', dark) : base;
    const sh = shadowOf(b, V.shadow), [lx, ly] = V.light;
    back.push(d);
    let s = `<clipPath id="${id}"><path d="${d}"/></clipPath><path d="${d}" fill="${sh}"/>`;
    s += `<g clip-path="url(#${id})"><path d="${d}" fill="${b}" transform="translate(${lx},${ly})"/>`;
    if (o.hi) s += o.hi;
    if (V.rim && !o.noRim) s += `<path d="${d}" fill="none" stroke="${V.rim}" stroke-width="${o.far ? 1.1 : 1.7}" opacity="${o.far ? 0.5 : 0.95}" transform="translate(2.2,0.8)"/>`;
    s += `</g><path d="${d}" fill="none" stroke="${ink}" stroke-width="${o.lw ?? lw}" stroke-linejoin="round"/>`;
    parts.push(s);
  }
  const line = (pts, w = lw * 0.6, op = 0.55, c = ink) => parts.push(`<path d="${smooth(pts, false)}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" opacity="${op}"/>`);
  const raw = (s) => parts.push(s);
  function finish() {
    // 外輪廓比內線粗（貼紙／剪影描邊），這是小尺寸還看得清楚的關鍵
    const sil = back.map((d) => `<path d="${d}"/>`).join('');
    let out = '';
    if (V.sticker) out += `<g fill="${V.sticker}" stroke="${V.sticker}" stroke-width="${V.stickerW}" stroke-linejoin="round">${sil}</g>`;
    out += `<g fill="${ink}" stroke="${ink}" stroke-width="${lw * 2.4}" stroke-linejoin="round">${sil}</g>`;
    return out + parts.join('');
  }
  return { part, line, raw, finish };
}

function drawFigure(pose, V) {
  const P = skeleton(pose, V), Rr = makeRenderer(V), C = V.col, ws = V.wf, r = V.r;
  let svg = `<ellipse cx="${f((P.nan[0] + P.fan[0]) / 2 + 6)}" cy="184" rx="${34 * ws}" ry="5" fill="#000" opacity=".45"/>`;
  if (V.glow) svg += `<ellipse cx="${f(P.hip[0] + 4)}" cy="${f(P.hip[1] - 10)}" rx="58" ry="78" fill="${V.glow}" opacity=".16" filter="url(#blur)"/>`;

  const dumbbell = (h, far) => {
    const lat = [6.5 * ws, -1.6], a = add(h, lat, -1), b = add(h, lat);
    const plate = (c) => { const k = 7.8 * V.bell; return smooth([[c[0] - 3.2, c[1] - k], [c[0] + 3.2, c[1] - k], [c[0] + 3.4, c[1] + k], [c[0] - 3.4, c[1] + k]], true, 0.08); };
    Rr.part(plate(b), C.iron, { far, hi: `<rect x="${b[0] - 1.4}" y="${b[1] - 6}" width="1.3" height="9" fill="#fff" opacity=".35"/>` });
    return () => Rr.part(plate(a), C.iron, { far, hi: `<rect x="${a[0] - 1.4}" y="${a[1] - 6}" width="1.3" height="9" fill="#fff" opacity=".35"/>` });
  };
  const fist = (h, el, far) => {
    const d = nrm(sub(h, el)), n = perp(d), s = V.hand;
    const pts = [add(add(h, d, -s * 0.5), n, s * 0.62), add(add(h, d, s * 0.75), n, s * 0.55), add(add(h, d, s * 0.85), n, -s * 0.5), add(add(h, d, -s * 0.45), n, -s * 0.66)];
    Rr.part(smooth(pts, true, 0.12), C.skin, { far });
    const k1 = add(add(h, d, s * 0.25), n, s * 0.6), k2 = add(add(h, d, s * 0.25), n, -s * 0.5);
    if (!far) Rr.line([k1, add(add(h, d, s * 0.35), n, 0), k2], lw0(V) * 0.5, 0.5);
  };
  const lw0 = (V) => V.lw;
  const shoe = (an, ang, far) => {
    const d = dir(ang), n = perp(d), F = V.L.foot, q = (x, y) => add(add(an, d, x), n, y);
    const up = smooth([q(-6, -5.5), q(F * 0.45, -5), q(F + 2.5, -1), q(F + 3.4, 3.4), q(-7, 4.2), q(-7.6, -1)], true, 0.13);
    Rr.part(up, C.shoe, { far });
    Rr.part(poly([q(-7.8, 3), q(F + 3.6, 2.6), q(F + 3, 6.2), q(-7.4, 6.4)]), C.sole, { far, noRim: true });
    if (!far) Rr.line([q(-2, -2), q(4, 1.5), q(9, -1.5)], V.lw * 0.7, 0.9, C.accent);
  };
  const legSet = (hipP, kn, an, to, ang, far) => {
    Rr.part(limb(kn, an, PROF.shin, ws), C.skin, { far });
    shoe(an, ang, far);
    Rr.part(limb(hipP, kn, PROF.thigh, ws * V.leg), C.skin, { far });
    // 短褲：大腿上半段
    const mid = add(hipP, sub(kn, hipP), 0.55);
    Rr.part(limb(add(hipP, sub(kn, hipP), -0.05), mid, [[0, 10, 10], [1, 9.6, 11]], ws * V.leg), C.shorts, { far });
    if (!far && V.detail > 0) { const q = (t, w) => add(add(hipP, sub(kn, hipP), t), perp(nrm(sub(kn, hipP))), w * ws); Rr.line([q(0.62, -6), q(0.8, -2.5), q(0.95, 1)], V.lw * 0.5, 0.45); Rr.line([add(add(kn, sub(an, kn), 0.15), perp(nrm(sub(an, kn))), 4 * ws), add(add(kn, sub(an, kn), 0.5), perp(nrm(sub(an, kn))), 2.5 * ws)], V.lw * 0.5, 0.4); }
  };
  const armSet = (sh, el, ha, far, bell) => {
    const after = bell ? dumbbell(ha, far) : null;
    Rr.part(limb(sh, el, PROF.upper, ws * V.arm), C.skin, { far });
    Rr.part(limb(el, ha, PROF.fore, ws * V.arm), C.skin, { far });
    fist(ha, el, far);
    if (after) after();
    // 三角肌：獨立一塊，練過的肩膀
    const d = nrm(sub(el, sh)), n = perp(d), c = add(sh, d, V.L.upper * 0.14), a = 8 * ws * V.arm;
    Rr.part(smooth([add(c, d, -a * 0.8), add(add(c, n, a * 0.8), d, -a * 0.1), add(add(c, d, a * 1.05), n, a * 0.25), add(add(c, d, a * 0.9), n, -a * 0.3), add(add(c, n, -a * 0.82), d, -a * 0.05)], true, 0.17), C.skin, { far, hi: far ? '' : `<ellipse cx="${f(c[0] + 1.5)}" cy="${f(c[1] - 2.5)}" rx="1.8" ry="1.1" fill="#fff" opacity=".4"/>` });
  };

  // 遠側手腳（暗、在身體後面）
  legSet(P.fhip, P.fkn, P.fan, P.fto, P.farFootAng, true);
  armSet(P.fsh, P.fel, P.fha, true, pose.bell);
  // 近側腿
  legSet(P.nhip, P.nkn, P.nan, P.nto, P.footAng, false);

  // 軀幹（3/4 視角：前胸比背寬）
  const T = (sv, w) => add(add(P.hip, P.d, sv * V.L.torso), P.v, w);
  const ch = V.chest, wf = ws;
  const front = [[0, 10], [0.14, 10], [0.36, 10], [0.6, 15 * ch], [0.8, 18 * ch], [0.96, 13 * ch]];
  const backS = [[0.98, -7 * ch], [0.8, -9.5 * ch], [0.55, -8.5], [0.33, -7.5], [0.13, -9], [0, -9]];
  const torso = smooth([...front.map(([s, w]) => T(s, w * wf)), T(1.07, 1.5), ...backS.map(([s, w]) => T(s, w * wf))]);
  Rr.part(torso, C.skin);
  // 背心
  const vest = smooth([T(0.05, 10.6 * wf), T(0.36, 10.4 * wf), T(0.6, 15.2 * ch * wf), T(0.76, 17 * ch * wf), T(0.86, 10 * wf), T(0.98, 5), T(0.9, -2 * wf), T(0.8, -7 * ch * wf), T(0.55, -8.9 * wf), T(0.32, -7.9 * wf), T(0.05, -9.6 * wf)]);
  Rr.part(vest, C.top, { hi: `<path d="${smooth([T(0.7, 3 * wf), T(0.5, 4 * wf), T(0.3, 3 * wf)], false)}" stroke="#fff" stroke-width="1.4" opacity=".18" fill="none"/>` });
  Rr.raw(`<path d="${poly([T(0.0, 11), T(0.08, 11.2), T(0.08, -12), T(0.0, -12)])}" fill="${C.shorts}" stroke="${V.ink}" stroke-width="${V.lw}"/>`);
  if (V.detail > 0) { Rr.line([T(0.84, 17 * ch * wf), T(0.7, 13 * wf), T(0.73, 6 * wf)], V.lw * 0.55, 0.5); }
  // 胸前圖案（原創：閃電啞鈴）
  const e = T(0.6, 9 * wf);
  Rr.raw(`<path d="${poly([add(e, [-2.5, -4]), add(e, [2, -4.5]), add(e, [0, -0.5]), add(e, [3, -0.8]), add(e, [-2, 5]), add(e, [-0.5, 0.8]), add(e, [-3.2, 1])])}" fill="${C.accent}" stroke="${V.ink}" stroke-width="${V.lw * 0.5}"/>`);

  // 脖子＋頭
  const nb = add(P.sh, P.d, -2), nt = add(P.head, nrm(sub(P.sh, P.head)), r * 0.5);
  Rr.part(limb(nb, nt, [[0, 6.5, 7.5], [1, 5.6, 5.8]], ws * V.neckW), C.skin);
  drawHead(Rr, P.head, P.headAng, V, C);
  // 近側手臂（最上層）
  armSet(P.nsh, P.nel, P.nha, false, pose.bell);
  return svg + Rr.finish();
}

function drawHead(Rr, c, ang, V, C) {
  const r = V.r, rad = ang * R, Q = (x, y) => [c[0] + (x * Math.cos(rad) - y * Math.sin(rad)) * r, c[1] + (x * Math.sin(rad) + y * Math.cos(rad)) * r];
  const pts = [];
  for (let a = 120; a <= 360; a += 30) pts.push(Q(Math.cos(a * R) * (a < 270 ? 1.06 : 1), Math.sin(a * R)));
  pts.push(Q(1.03, 0.36), Q(V.chin[0], V.chin[1]), Q(0.32, 1.02), Q(-0.38, 0.78));
  Rr.part(smooth(pts), C.skin);
  // 耳朵
  Rr.part(smooth([Q(-0.3, 0.08), Q(-0.08, 0.1), Q(-0.1, 0.42), Q(-0.27, 0.46), Q(-0.36, 0.3)], true, 0.2), C.skin, { lw: V.lw * 0.7, noRim: true });
  Rr.line([Q(-0.14, 0.18), Q(-0.24, 0.26), Q(-0.17, 0.36)], V.lw * 0.5, 0.5);
  // 頭髮：尖刺，不平滑
  const hair = [[1.0, -0.3], [0.88, -0.7], [1.05, -1.02], [0.55, -1.08], [0.5, -1.45], [0.05, -1.18], [-0.28, -1.5], [-0.55, -1.08], [-1.05, -1.18], [-1.0, -0.6], [-1.32, -0.35], [-0.95, 0.15], [-0.6, 0.2], [-0.28, -0.15], [0.1, -0.38], [0.5, -0.42], [0.78, -0.5], [0.92, -0.18]].map(([x, y]) => Q(x * V.hairK, y * (y < 0 ? V.hairK : 1)));
  Rr.part(poly(hair), C.hair, { hi: `<path d="${smooth([Q(-0.4, -0.95), Q(0.05, -0.88), Q(0.4, -0.75)], false)}" stroke="#fff" stroke-width="${r * 0.09}" opacity=".35" fill="none" stroke-linecap="round"/>` });
  // 臉：專注眼神（眉毛壓低、往鼻子斜）
  const E = V.eye;
  Rr.raw(`<ellipse cx="${f(Q(0.45, 0.13)[0])}" cy="${f(Q(0.45, 0.13)[1])}" rx="${f(r * 0.11 * E)}" ry="${f(r * 0.17 * E)}" fill="${V.ink}" transform="rotate(${f(ang)} ${f(Q(0.45, 0.13)[0])} ${f(Q(0.45, 0.13)[1])})"/>`);
  Rr.raw(`<ellipse cx="${f(Q(0.86, 0.11)[0])}" cy="${f(Q(0.86, 0.11)[1])}" rx="${f(r * 0.06 * E)}" ry="${f(r * 0.15 * E)}" fill="${V.ink}" transform="rotate(${f(ang)} ${f(Q(0.86, 0.11)[0])} ${f(Q(0.86, 0.11)[1])})"/>`);
  Rr.raw(`<circle cx="${f(Q(0.48, 0.07)[0])}" cy="${f(Q(0.48, 0.07)[1])}" r="${f(r * 0.045 * E)}" fill="#fff"/>`);
  Rr.line([Q(0.24, -0.13), Q(0.45, -0.1), Q(0.62, -0.01)], r * 0.11, 1);
  Rr.line([Q(0.76, -0.07), Q(0.97, -0.01)], r * 0.09, 1);
  Rr.line([Q(1.04, 0.2), Q(0.97, 0.33)], V.lw * 0.7, 0.8);
  Rr.line([Q(0.58, 0.62), Q(0.72, 0.6), Q(0.84, 0.63)], V.lw * 0.8, 0.9);
  if (V.blush) Rr.raw(`<ellipse cx="${f(Q(0.5, 0.42)[0])}" cy="${f(Q(0.5, 0.42)[1])}" rx="${f(r * 0.13)}" ry="${f(r * 0.06)}" fill="#ff7a8a" opacity=".45"/>`);
}

// ───────── 三種方向 ─────────
const BASE_COL = { skin: '#f1c39b', hair: '#2a2235', top: '#3d5b8f', shorts: '#232a3b', shoe: '#f5f6fa', sole: '#ff7a3d', accent: '#ffcf3d', iron: '#4a5263' };
const VARIANTS = [
  { id: 'chibi', name: 'A1 Q版貼紙', note: '頭大（約 1/3.5 身高）、白色貼紙外框、柔和陰影。可愛、小尺寸最清楚。',
    L: { torso: 38, neck: 7, upper: 21, fore: 19, thigh: 25, shin: 24, foot: 14 }, r: 21, wf: 1.0, chest: 1.05, arm: 1.0, leg: 1.0, neckW: 1.0, hand: 8.5, bell: 0.9,
    lw: 2.0, ink: '#1b1830', sticker: '#f7f8fc', stickerW: 11, shadow: 0.42, light: [2, -2], rim: null, glow: null, detail: 0, eye: 1.35, blush: true, chin: [0.72, 0.92], hairK: 1.0 },
