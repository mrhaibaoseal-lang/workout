<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 特效樣品</title>
<!--
  裝備特效（fx）3D 樣品預覽，10 種：火焰、符文法陣、金光（已定案）；電光、冰晶、夜雨、暗影煙、全像掃描、聖光、星塵（新樣品）。
  只用 Swift（RealityKit）也做得到的東西：canvas 畫的貼圖、面向鏡頭的平面、簡單網格、位置／縮放／旋轉／透明度隨 t 變；
  不用 shader、後處理、疊加混色；不用負的縮放（RealityKit 平面翻面會被背面剔除）。
  做法（2026-11-28 定案方向）：每種特效是固定數量的面片／小網格，每格用時間 t 的公式算位置、大小、透明度，
  不用 RealityKit 粒子模擬 → 同一個 t 一定是同一張圖，定格截圖可以指定 t。
  這裡的公式是之後 Swift 版的對照；改一邊要改另一邊。假人用基本款配色、簡化外形，只用來看特效的位置和大小。
  鏡頭照 Hero3DStageModel：fov 30、看 (0,0.8,0)、從 (0,1.2,4.6)、角色轉 -0.5 弧度、畫面比例 180:204。
-->
<style>
  :root { --s:#2C3340; --fg:#EEF1F5; --mu:#98A2B1; --co:#FF9F43; --trk:#3A4250; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: var(--fg);
    background: linear-gradient(#252B36, #1F242D 60%, #232833);
    font: 15px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--mu); margin: 0 0 16px; font-size: 14px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; background: var(--s);
    border-radius: 22px; padding: 12px 16px; margin-bottom: 18px;
    box-shadow: 8px 10px 20px rgb(0 0 0 / .22), inset -2px -2px 4px rgb(0 0 0 / .25), inset 2px 2px 4px rgba(255,255,255,.07); }
  button { background: var(--co); color: #2A1A10; border: 0; border-radius: 999px; padding: 7px 16px;
    font: inherit; font-weight: 700; cursor: pointer; }
  button.ghost { background: var(--trk); color: var(--fg); }
  button.on { outline: 2px solid var(--fg); }
  input[type=range] { width: 220px; accent-color: var(--co); }
  label { color: var(--mu); display: flex; gap: 6px; align-items: center; cursor: pointer; }
  #tl { font-variant-numeric: tabular-nums; min-width: 64px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  .card { background: var(--s); border-radius: 28px; padding: 14px;
    box-shadow: 8px 10px 20px rgb(0 0 0 / .22), inset -2px -2px 4px rgb(0 0 0 / .25), inset 2px 2px 4px rgba(255,255,255,.07); }
  .card h2 { font-size: 17px; margin: 0; }
  .card h2 .tag { font-size: 12px; font-weight: 600; color: var(--mu); background: var(--trk); border-radius: 999px; padding: 1px 8px; margin-left: 8px; vertical-align: 2px; }
  .card .meta { color: var(--mu); font-size: 13px; margin: 2px 0 8px; }
  .stage { display: flex; justify-content: center; }
  canvas { display: block; border-radius: 18px; touch-action: none; cursor: grab; }
  body.gray canvas { filter: grayscale(1); }
  .card ul { margin: 8px 0 0; padding-left: 18px; color: var(--mu); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>3D 特效樣品：10 種裝備特效</h1>
  <p class="sub">每種特效＝固定數量的面片，用時間 t 的公式算出位置；同一個 t 一定是同一張圖（定格截圖用）。假人是簡化外形、基本款配色。可以拖曳畫面轉角色。</p>
  <div class="bar">
    <button id="play">暫停</button>
    <input id="t" type="range" min="0" max="8" step="0.01" value="0">
    <span id="tl">t = 0.00</span>
    <button id="still" class="ghost">定格（截圖／減少動態）</button>
    <label><input id="gray" type="checkbox">灰階</label>
    <label><input id="small" type="checkbox">小尺寸（換裝格 88pt）</label>
    <span id="filter" style="display:flex;gap:8px">
      <button class="ghost on" data-f="all">全部 10 種</button>
      <button class="ghost" data-f="new">新樣品 7 種</button>
      <button class="ghost" data-f="done">已定案 3 種</button>
    </span>
  </div>
  <div class="grid" id="grid"></div>
</main>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ---------- 共用小工具（Swift 版照抄） ----------
const frac = x => x - Math.floor(x);
const h = i => frac(Math.sin(i * 12.9898) * 43758.5453);   // 固定雜湊：每顆的「個性」
const GOLDEN = 2.39996;                                       // 黃金角：讓 N 顆平均散開

function canvasTex(w, hh, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = hh;
  draw(c.getContext('2d'), w, hh);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const glowTex = (rgb, a = 0.85) => canvasTex(128, 128, (g, w) => {
  const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(0.45, `rgba(${rgb},${a * 0.45})`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, w, w);
});
const spriteMat = (map, extra = {}) => new THREE.SpriteMaterial({ map, transparent: true, depthWrite: false, ...extra });
const groundMat = map => new THREE.MeshBasicMaterial({ map, transparent: true, depthWrite: false, side: THREE.DoubleSide });
function groundPlane(size, map, y = 0.01) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size), groundMat(map));
  m.rotation.x = -Math.PI / 2; m.position.y = y; m.renderOrder = 1; return m;
}

// 卡通三階明暗（和 Toon.metal 同概念，只是近似）
const toonRamp = (() => { const d = new Uint8Array([90, 170, 255]); const t = new THREE.DataTexture(d, 3, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
const toon = (color, extra = {}) => new THREE.MeshToonMaterial({ color, gradientMap: toonRamp, ...extra });
const inkMat = new THREE.MeshBasicMaterial({ color: 0x15171c, side: THREE.BackSide });
function inked(geo, mat, s = 1.06, ink = inkMat) {
  const g = new THREE.Group(); g.add(new THREE.Mesh(geo, mat));
  const o = new THREE.Mesh(geo, ink); o.scale.setScalar(s); g.add(o); return g;
}

// ---------- 假人（基本款配色、簡化外形） ----------
function dummy() {
  const g = new THREE.Group();
  const skin = toon(0xF5CFA8), tee = toon(0xF4F5F7), shorts = toon(0x3E4652), shoe = toon(0x9AA4AF), hair = toon(0x3A2A22);
  const add = (geo, mat, x, y, z = 0, s = 1.06) => { const m = inked(geo, mat, s); m.position.set(x, y, z); g.add(m); return m; };
  for (const sx of [-1, 1]) {
    add(new THREE.CapsuleGeometry(0.085, 0.36, 4, 12), skin, sx * 0.12, 0.32);
    add(new THREE.BoxGeometry(0.17, 0.1, 0.26), shoe, sx * 0.12, 0.06, 0.04, 1.12);
    const arm = add(new THREE.CapsuleGeometry(0.07, 0.34, 4, 12), skin, sx * 0.33, 0.86);
    arm.rotation.z = sx * 0.22;
  }
  add(new THREE.CapsuleGeometry(0.15, 0.08, 4, 12), shorts, 0, 0.6);
  g.userData.torso = add(new THREE.CapsuleGeometry(0.2, 0.22, 4, 16), tee, 0, 0.9);
  add(new THREE.SphereGeometry(0.34, 24, 18), skin, 0, 1.42);
  const cap = add(new THREE.SphereGeometry(0.355, 24, 12, 0, Math.PI * 2, 0, 1.25), hair, 0, 1.45, -0.01, 1.03);
  cap.rotation.x = -0.35;
  for (const sx of [-1, 1]) { const e = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), inkMat.clone()); e.material.side = THREE.FrontSide;
    e.position.set(sx * 0.12, 1.42, 0.32); g.add(e); }
  const base = new THREE.Mesh(new THREE.CircleGeometry(0.62, 48), new THREE.MeshBasicMaterial({ color: 0x353C49 }));
  base.rotation.x = -Math.PI / 2; base.position.y = 0.001; g.add(base);
  return g;
}

// ---------- 符文：從 3×3 格點挑線段，固定種子 → 每個字形不同、原創 ----------
function glyph(g, seed, cx, cy, size, ang) {
  const P = (k) => [((k % 3) - 1) * size / 2, (Math.floor(k / 3) - 1) * size / 2];
  g.save(); g.translate(cx, cy); g.rotate(ang); g.beginPath();
  g.moveTo(...P(1)); g.lineTo(...P(7));                                   // 每個符文都有中間一豎
  for (let k = 0; k < 3; k++) { const a = Math.floor(h(seed * 7 + k) * 9), b = Math.floor(h(seed * 13 + k + 5) * 9);
    if (a !== b) { g.moveTo(...P(a)); g.lineTo(...P(b)); } }
  g.stroke(); g.restore();
}

// =====================================================================
// 1. 火焰（熔岩・史詩）：腳下往上竄的水滴形火舌（帶描邊，卡通火）＋火星＋地面暖光＋身後暖光
//    面片 18＋8＋2＝28
// =====================================================================
function makeFire(root) {
  const C2 = '#FF5A1F', C3 = '#FFC23D';
  const flameTex = (outer, core) => canvasTex(64, 128, (g, w, hh) => {
    const p = new Path2D(); p.moveTo(w / 2, 4);
    p.bezierCurveTo(w * 0.98, hh * 0.5, w * 0.92, hh * 0.97, w / 2, hh - 4);
    p.bezierCurveTo(w * 0.08, hh * 0.97, w * 0.02, hh * 0.5, w / 2, 4);
    g.fillStyle = outer; g.fill(p);
    g.lineWidth = 4; g.strokeStyle = 'rgba(110,22,0,0.95)'; g.stroke(p);
    g.save(); g.translate(w / 2, hh - 6); g.scale(0.55, 0.58); g.translate(-w / 2, -(hh - 6)); g.fillStyle = core; g.fill(p); g.restore();
  });
  const texA = flameTex(C2, C3), texB = flameTex(C3, '#FFF6D8');
  const flames = [...Array(18)].map((_, i) => { const s = new THREE.Sprite(spriteMat(i % 3 ? texA : texB));
    s.center.set(0.5, 0.1); root.add(s); return s; });
  const sparkTex = canvasTex(32, 32, (g) => { g.fillStyle = '#FFE08A'; g.translate(16, 16); g.rotate(Math.PI / 4); g.fillRect(-8, -8, 16, 16); });
  const sparks = [...Array(8)].map(() => { const s = new THREE.Sprite(spriteMat(sparkTex)); root.add(s); return s; });
  const floor = groundPlane(1.5, glowTex('255,110,30')); root.add(floor);
  const back = new THREE.Sprite(spriteMat(glowTex('255,120,40', 0.6))); back.position.set(0, 0.85, -0.45); back.scale.set(1.9, 2.1, 1); root.add(back);

  return (t) => {
    flames.forEach((s, i) => {
      const ph = frac(t * 0.8 + h(i));
      const a = i * GOLDEN, r = (0.22 + 0.22 * h(i + 7)) * (1 + 0.5 * ph);
      s.position.set(Math.cos(a) * r + Math.sin(t * 3 + i) * 0.05 * ph, ph * (0.85 + 0.55 * h(i + 3)), Math.sin(a) * r);
      const sz = 0.12 + 0.4 * Math.pow(1 - ph, 0.8);
      s.scale.set(sz * 0.62, sz, 1);
      s.material.opacity = Math.min(1, ph / 0.08) * (1 - ph * 0.85);
    });
    sparks.forEach((s, i) => {
      const ph = frac(t * 0.45 + h(i + 40)), a = i * GOLDEN + 1, r = 0.3 + 0.25 * h(i + 41);
      s.position.set(Math.cos(a) * r + Math.sin(t * 2 + i) * 0.08, 0.1 + ph * 1.9, Math.sin(a) * r);
      s.scale.setScalar(0.045); s.material.opacity = Math.sin(Math.PI * ph) * (0.6 + 0.4 * Math.sin(t * 20 + i));
    });
    floor.material.opacity = 0.55 + 0.15 * Math.sin(t * 5) + 0.06 * Math.sin(t * 13);
    back.material.opacity = 0.28 + 0.06 * Math.sin(t * 4);
  };
}

// =====================================================================
// 2. 符文法陣（符文戰神・傳說）：腳下兩層反向旋轉的圓盤（外圈符文＋六芒星、內圈虛線）
//    ＋每 2 秒一道擴散光環＋往上飄的光點＋從陣上升起的符文。地面件 4＋光點 14＋符文 4＝22
// =====================================================================
function makeMagic(root) {
  const G = '#3DF5A0', AU = '#E3C47E';
  const outer = canvasTex(512, 512, (g) => {
    g.translate(256, 256); g.lineCap = 'round'; g.shadowColor = G; g.shadowBlur = 14;
    g.strokeStyle = G; g.lineWidth = 7; g.beginPath(); g.arc(0, 0, 238, 0, Math.PI * 2); g.stroke();
    g.lineWidth = 3; g.beginPath(); g.arc(0, 0, 196, 0, Math.PI * 2); g.stroke();
    g.globalAlpha = 0.85; g.lineWidth = 3.5;
    for (const off of [0, Math.PI]) { g.beginPath();
      for (let k = 0; k < 3; k++) { const a = off - Math.PI / 2 + k * Math.PI * 2 / 3; g.lineTo(Math.cos(a) * 196, Math.sin(a) * 196); }
      g.closePath(); g.stroke(); }
    g.globalAlpha = 1; g.strokeStyle = AU; g.shadowColor = AU; g.lineWidth = 3.5;
    for (let k = 0; k < 12; k++) { const a = k / 12 * Math.PI * 2; glyph(g, k + 1, Math.cos(a) * 217, Math.sin(a) * 217, 22, a + Math.PI / 2); }
  });
  const inner = canvasTex(256, 256, (g) => {
    g.translate(128, 128); g.strokeStyle = G; g.shadowColor = G; g.shadowBlur = 10; g.lineWidth = 4;
    g.setLineDash([14, 10]); g.beginPath(); g.arc(0, 0, 118, 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
    g.lineWidth = 3; g.beginPath(); g.arc(0, 0, 70, 0, Math.PI * 2); g.stroke();
    g.rotate(Math.PI / 4); g.strokeRect(-46, -46, 92, 92);
    g.fillStyle = G; for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2; g.beginPath(); g.arc(Math.cos(a) * 94, Math.sin(a) * 94, 6, 0, Math.PI * 2); g.fill(); }
  });
  const ringTex = canvasTex(256, 256, (g) => { g.strokeStyle = G; g.shadowColor = G; g.shadowBlur = 12; g.lineWidth = 8;
    g.beginPath(); g.arc(128, 128, 112, 0, Math.PI * 2); g.stroke(); });
  const glow = groundPlane(1.9, glowTex('61,245,160', 0.5), 0.006);
  const discO = groundPlane(1.6, outer, 0.012), discI = groundPlane(1.0, inner, 0.016), pulse = groundPlane(1, ringTex, 0.02);
  [glow, discO, discI, pulse].forEach(m => root.add(m));
  const moteTex = glowTex('160,255,210', 1);
  const motes = [...Array(14)].map(() => { const s = new THREE.Sprite(spriteMat(moteTex)); root.add(s); return s; });
  const runeTex = [0, 1, 2, 3].map(k => canvasTex(64, 64, (g) => { g.strokeStyle = AU; g.shadowColor = G; g.shadowBlur = 8;
    g.lineWidth = 5; g.lineCap = 'round'; glyph(g, k + 20, 32, 32, 36, 0); }));
  const runes = runeTex.map(tx => { const s = new THREE.Sprite(spriteMat(tx)); root.add(s); return s; });

  return (t) => {
    discO.rotation.z = t * 0.35; discI.rotation.z = -t * 0.6;
    const pp = frac(t / 2);                                    // 每 2 秒一道擴散光環
    pulse.scale.setScalar(0.5 + pp * 1.3); pulse.material.opacity = (1 - pp) * 0.8;
    glow.material.opacity = 0.7 + 0.2 * Math.sin(t * 3);
    motes.forEach((s, i) => {
      const ph = frac(t * 0.45 + h(i + 60)), a = i / 14 * Math.PI * 2 + t * 0.35;
      s.position.set(Math.cos(a) * 0.72, 0.05 + ph * 1.6, Math.sin(a) * 0.72);
      s.scale.setScalar(0.07 + 0.04 * h(i)); s.material.opacity = Math.sin(Math.PI * ph);
    });
    runes.forEach((s, i) => {
      const ph = frac(t * 0.25 + i / 4), a = i * Math.PI / 2 + t * 0.35;
      s.position.set(Math.cos(a) * 0.56, 0.1 + ph * 1.2, Math.sin(a) * 0.56);
      s.scale.setScalar(0.16); s.material.opacity = Math.sin(Math.PI * ph);
    });
  };
}

// =====================================================================
// 3. 金光（黃金・傳說）：從頭上灑落、會翻面的立體金幣（卡通上色＋描邊）＋四芒閃光＋腳下王者光圈
//    金幣 12（小網格）＋閃光 8＋地面件 2＝22
// =====================================================================
function makeGold(root) {
  const face = canvasTex(128, 128, (g) => {
    g.fillStyle = '#F2B630'; g.fillRect(0, 0, 128, 128);
    g.strokeStyle = '#B57A10'; g.lineWidth = 10; g.beginPath(); g.arc(64, 64, 56, 0, Math.PI * 2); g.stroke();
    g.fillStyle = '#FFE58A'; g.beginPath();                                // 凸起的五角星
    for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? 16 : 36; g.lineTo(64 + Math.cos(a) * r, 64 + Math.sin(a) * r); }
    g.closePath(); g.fill(); g.strokeStyle = '#B57A10'; g.lineWidth = 4; g.stroke();
  });
  const geo = new THREE.CylinderGeometry(0.075, 0.075, 0.016, 28); geo.rotateX(Math.PI / 2);
  const mats = [toon(0xC98E1A), toon(0xffffff, { map: face }), toon(0xffffff, { map: face })];
  const coinInk = new THREE.MeshBasicMaterial({ color: 0x4a2c00, side: THREE.BackSide, transparent: true });
  const coins = [...Array(12)].map(() => {
    const g = new THREE.Group(); const m = new THREE.Mesh(geo, mats.map(x => x.clone())); m.material.forEach(x => x.transparent = true);
    const o = new THREE.Mesh(geo, coinInk.clone()); o.scale.set(1.14, 1.14, 1.6); g.add(m, o); root.add(g); g.userData = { m, o }; return g;
  });
  const starTex = canvasTex(64, 64, (g) => { g.translate(32, 32); g.fillStyle = '#FFF1B8'; g.shadowColor = '#FFC83D'; g.shadowBlur = 10;
    g.beginPath(); for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, r = k % 2 ? 5 : 28; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.closePath(); g.fill(); });
  const stars = [...Array(8)].map(() => { const s = new THREE.Sprite(spriteMat(starTex)); root.add(s); return s; });
  const ringTex = canvasTex(256, 256, (g) => { g.translate(128, 128); g.strokeStyle = '#FFC83D'; g.shadowColor = '#FFC83D'; g.shadowBlur = 10;
    g.lineWidth = 5; g.beginPath(); g.arc(0, 0, 116, 0, Math.PI * 2); g.stroke();
    g.fillStyle = '#FFF1B8'; for (let k = 0; k < 8; k++) { g.save(); g.rotate(k * Math.PI / 4); g.translate(0, -116); g.rotate(Math.PI / 4); g.fillRect(-9, -9, 18, 18); g.restore(); } });
  const glow = groundPlane(1.7, glowTex('255,200,61', 0.55), 0.006), ring = groundPlane(1.35, ringTex, 0.014);
  root.add(glow, ring);

  return (t) => {
    coins.forEach((c, i) => {
      const ph = frac(t * 0.5 + h(i + 80)), a = i * GOLDEN + 0.5, r = 0.46 + 0.3 * h(i + 81);
      c.position.set(Math.cos(a) * r, 2.35 - 2.3 * Math.pow(ph, 1.6), Math.sin(a) * r);   // 越落越快
      c.rotation.set(t * 5 + i * 1.3, i * 0.9, 0);                                           // 翻面
      const op = Math.min(1, ph / 0.08, (1 - ph) / 0.1);
      c.userData.m.material.forEach(x => x.opacity = op); c.userData.o.material.opacity = op;
    });
    stars.forEach((s, i) => {
      const a = i * GOLDEN + 2, r = 0.42 + 0.22 * h(i + 90);
      s.position.set(Math.cos(a) * r, 0.3 + 1.55 * h(i + 91), Math.sin(a) * r);
      const o = Math.pow(Math.max(0, Math.sin(t * 2.4 + i * 1.9)), 4);
      s.scale.setScalar(0.03 + 0.2 * o); s.material.opacity = o; s.material.rotation = t * 0.6;
    });
    ring.rotation.z = t * 0.25; glow.material.opacity = 0.75 + 0.15 * Math.sin(t * 2.5);
  };
}

// =====================================================================
// 4. 電光（霓虹・史詩）：手臂、啞鈴旁「啪」一下閃出的鋸齒閃電（深色描邊＋白芯），每 1.25 秒一陣、陣內錯開，
//    每陣位置和角度重抽；閃的瞬間噴出火花，手邊電光暈跟著亮。閃電 8＋火花 12＋手部光暈 2＝22
// =====================================================================
function makeBolt(root) {
  const CY = '#19E3FF', PK = '#FF3DCB';
  const boltTex = (seed, col) => canvasTex(96, 192, (g, w, hh) => {
    const pts = [];
    for (let k = 0; k <= 6; k++) {
      const side = k === 0 || k === 6 ? 0 : (k % 2 ? 1 : -1);
      pts.push([w / 2 + side * (8 + 13 * h(seed * 9 + k)), 10 + k * (hh - 20) / 6]);
    }
    const b0 = pts[2], bs = b0[0] >= w / 2 ? 1 : -1;                       // 分岔往外長
    const br = [b0, [b0[0] + bs * 18, b0[1] + 20], [b0[0] + bs * 12, b0[1] + 30], [b0[0] + bs * 26, b0[1] + 50]];
    const line = P => { g.beginPath(); P.forEach(([x, y], k) => k ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke(); };
    g.lineJoin = 'miter'; g.lineCap = 'round';
    g.shadowColor = col; g.shadowBlur = 16; g.strokeStyle = col; g.lineWidth = 16; line(pts); g.lineWidth = 11; line(br);
    g.shadowBlur = 0; g.strokeStyle = '#0B1630'; g.lineWidth = 13; line(pts); g.lineWidth = 9; line(br);
    g.strokeStyle = col; g.lineWidth = 9; line(pts); g.lineWidth = 6; line(br);
    g.strokeStyle = '#FFFFFF'; g.lineWidth = 4; line(pts); g.lineWidth = 2.5; line(br);
  });
  const texs = [boltTex(1, CY), boltTex(2, CY), boltTex(3, CY), boltTex(4, PK)];
  const bolts = [...Array(8)].map((_, i) => { const s = new THREE.Sprite(spriteMat(texs[i % 4])); root.add(s); return s; });
  const sparkTex = canvasTex(32, 32, (g) => { g.fillStyle = '#E8FDFF'; g.shadowColor = CY; g.shadowBlur = 8; g.translate(16, 16); g.rotate(Math.PI / 4); g.fillRect(-6, -6, 12, 12); });
  const sparks = [...Array(12)].map(() => { const s = new THREE.Sprite(spriteMat(sparkTex)); root.add(s); return s; });
  const handTex = glowTex('25,227,255', 0.9);
  const hands = [-1, 1].map(sd => { const s = new THREE.Sprite(spriteMat(handTex)); s.position.set(sd * 0.38, 0.6, 0.06); root.add(s); return s; });

  const burst = (i, t) => {                                   // 第 i 道閃電在這一陣的狀態（同一個 t 同一個結果）
    const B = t * 0.9, k = Math.floor(B), q = B - k;           // 每 1.1 秒一陣
    const st = 0.3 * h(k * 7 + i + 1);                        // 陣內錯開出手
    return { k, q, st, life: (q - st) / 0.15, skip: h(k * 19 + i + 3) < 0.2, side: i % 2 ? 1 : -1,
      x: (i % 2 ? 1 : -1) * (0.46 + 0.14 * h(k * 5 + i + 4)), y: 0.45 + 0.7 * h(k * 3 + i * 7 + 2), z: (h(k * 11 + i + 5) - 0.5) * 0.36 };
  };
  return (t) => {
    const boost = [0, 0];
    bolts.forEach((s, i) => {
      const b = burst(i, t), L = b.life;
      s.position.set(b.x, b.y, b.z);
      s.material.rotation = -b.side * (0.2 + 0.6 * h(b.k * 13 + i + 6));
      const len = 0.5 + 0.25 * h(b.k * 17 + i + 7); s.scale.set(len * 0.5, len, 1);
      s.material.opacity = b.skip || L < 0 || L >= 1 ? 0 : L < 0.4 ? 1 : L < 0.55 ? 0.25 : 0.9 * (1 - (L - 0.55) / 0.45);
      if (!b.skip && L >= 0) boost[(b.side + 1) / 2] = Math.max(boost[(b.side + 1) / 2], Math.exp(-L * 0.5));
    });
    sparks.forEach((s, j) => {
      const b = burst(j % 8, t), sl = (b.q - b.st) / 0.3, a = h(b.k * 23 + j + 8) * Math.PI * 2;
      s.position.set(b.x + Math.cos(a) * 0.3 * sl, b.y + Math.sin(a) * 0.25 * sl - 0.15 * sl * sl, b.z);
      s.scale.setScalar(0.055); s.material.opacity = b.skip || sl < 0 || sl >= 1 ? 0 : 1 - sl;
    });
    hands.forEach((s, k) => { s.material.opacity = 0.25 + 0.08 * Math.sin(t * 11 + k) + 0.6 * boost[k]; s.scale.setScalar(0.32 + 0.18 * boost[k]); });
  };
}

// =====================================================================
// 5. 冰晶（冰霜・史詩）：從上方緩緩飄落、會轉的六角雪花（三種花樣，深藍描邊＋白芯）＋細碎閃爍的冰晶粉
//    雪花 16＋冰晶粉 10＝26
// =====================================================================
function makeIce(root) {
  const INK = '#1E5C8C', C2 = '#4FB8FF';
  const flakeTex = kind => canvasTex(128, 128, (g) => {
    g.translate(64, 64); g.lineCap = 'round'; g.lineJoin = 'round';
    const arm = () => { g.beginPath(); g.moveTo(0, 0);
      if (kind === 0) { g.lineTo(0, -54); g.moveTo(0, -28); g.lineTo(-15, -43); g.moveTo(0, -28); g.lineTo(15, -43); }
      if (kind === 1) { g.lineTo(0, -54); for (const [d, l] of [[-24, 9], [-40, 13]]) { g.moveTo(0, d); g.lineTo(-l, d - l); g.moveTo(0, d); g.lineTo(l, d - l); } }
      if (kind === 2) { g.lineTo(0, -38); g.moveTo(0, -36); g.lineTo(-9, -46); g.lineTo(0, -56); g.lineTo(9, -46); g.closePath(); }
    };
    const pass = (col, w) => { g.strokeStyle = col; g.lineWidth = w; for (let k = 0; k < 6; k++) { g.save(); g.rotate(k * Math.PI / 3); arm(); g.stroke(); g.restore(); } };
    pass(INK, 13); pass(C2, 9); pass('#FFFFFF', 4.5);
    if (kind) { const r = kind === 1 ? 14 : 22; g.beginPath();                // 中心六角板
      for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3 + Math.PI / 6; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      g.closePath(); g.fillStyle = '#E4F6FF'; g.fill(); g.strokeStyle = INK; g.lineWidth = 5; g.stroke(); }
  });
  const ft = [0, 1, 2].map(flakeTex);
  const flakes = [...Array(16)].map((_, i) => { const s = new THREE.Sprite(spriteMat(ft[i % 3])); root.add(s); return s; });
  const dustTex = canvasTex(32, 32, (g) => { g.translate(16, 16); g.fillStyle = '#FFFFFF'; g.shadowColor = C2; g.shadowBlur = 8;
    g.beginPath(); g.moveTo(0, -13); g.lineTo(5, 0); g.lineTo(0, 13); g.lineTo(-5, 0); g.closePath(); g.fill(); });
  const dust = [...Array(10)].map(() => { const s = new THREE.Sprite(spriteMat(dustTex)); root.add(s); return s; });

  return (t) => {
    flakes.forEach((s, i) => {
      const u = t * 0.17 + h(i + 200), k = Math.floor(u), ph = u - k;      // 約 6 秒落一趟，每趟換位置
      const a = i * GOLDEN + k * 1.7, r = 0.28 + 0.55 * h(k * 7 + i + 201);
      s.position.set(Math.cos(a) * r + Math.sin(t * 1.1 + i * 2) * 0.09, 2.3 - 2.25 * ph, Math.sin(a) * r);
      s.scale.setScalar(0.12 + 0.1 * h(i + 202));
      s.material.rotation = t * (0.5 + 0.7 * h(i + 203)) * (i % 2 ? 1 : -1) + i;
      s.material.opacity = Math.min(1, ph / 0.1, (1 - ph) / 0.12);
    });
    dust.forEach((s, i) => {
      const u = t * 0.3 + h(i + 220), k = Math.floor(u), ph = u - k;
      const a = i * GOLDEN * 1.3 + k * 2.3, r = 0.2 + 0.7 * h(k * 5 + i + 221);
      const tw = Math.pow(Math.max(0, Math.sin(t * 6 + i * 2.3)), 3);
      s.position.set(Math.cos(a) * r, 2.1 - 2.0 * ph, Math.sin(a) * r);
      s.scale.setScalar(0.04 + 0.04 * tw); s.material.opacity = (0.35 + 0.65 * tw) * Math.min(1, ph / 0.1, (1 - ph) / 0.1);
    });
  };
}

// =====================================================================
// 6. 夜雨（夜巡者・史詩）：上方斜落的細長雨絲（少數染上路燈橘）＋落地時在地面散開的漣漪圈
//    雨絲 22＋地面漣漪 7＝29
// =====================================================================
function makeRain(root) {
  const streakTex = rgb => canvasTex(16, 128, (g, w, hh) => {
    const gr = g.createLinearGradient(0, 0, 0, hh);
    gr.addColorStop(0, `rgba(${rgb},0)`); gr.addColorStop(0.65, `rgba(${rgb},0.75)`); gr.addColorStop(1, `rgba(${rgb},1)`);
    g.strokeStyle = gr; g.lineWidth = 9; g.lineCap = 'round'; g.beginPath(); g.moveTo(w / 2, 4); g.lineTo(w / 2, hh - 4); g.stroke();
  });
  const texB = streakTex('214,228,250'), texO = streakTex('255,176,102');
  const S = 0.3, H = 2.4;                                       // 斜率、落下高度
  const drop = (i, t) => {
    const u = t * (1.25 + 0.35 * h(i + 300)) + h(i + 301), k = Math.floor(u);
    const spot = kk => { const a = i * GOLDEN + kk * 2.1, r = 0.12 + 0.62 * Math.sqrt(h(kk * 7 + i + 302)); return [Math.cos(a) * r, Math.sin(a) * r]; };
    return { ph: u - k, k, spot };
  };
  const drops = [...Array(22)].map((_, i) => { const s = new THREE.Sprite(spriteMat(i % 6 === 5 ? texO : texB)); s.center.set(0.5, 0); root.add(s); return s; });
  const rippleTex = canvasTex(128, 128, (g) => { g.strokeStyle = 'rgba(225,236,252,1)'; g.lineWidth = 12;
    g.beginPath(); g.arc(64, 64, 56, 0, Math.PI * 2); g.stroke(); g.globalAlpha = 0.7; g.lineWidth = 5; g.beginPath(); g.arc(64, 64, 32, 0, Math.PI * 2); g.stroke(); });
  const ripples = [...Array(7)].map((_, j) => { const m = groundPlane(1, rippleTex, 0.012 + j * 0.001); root.add(m); return m; });

  return (t) => {
    drops.forEach((s, i) => {
      const d = drop(i, t), [x, z] = d.spot(d.k);
      s.position.set(x + S * H * (1 - d.ph), H * (1 - d.ph), z);              // 落點在地上，沿斜線往回推
      s.scale.set(0.05, 0.34, 1); s.material.rotation = -0.26;
      s.material.opacity = Math.min(1, d.ph / 0.06) * 0.9;
    });
    ripples.forEach((m, j) => {                                               // 第 j*3 滴落地後散開
      const d = drop(j * 3, t), q = d.ph / 0.6, [x, z] = d.spot(d.k - 1);
      m.position.x = x; m.position.z = z; m.scale.setScalar(0.1 + 0.45 * Math.min(q, 1));
      m.material.opacity = q < 1 ? 1 - q * q : 0;
    });
  };
}

// =====================================================================
// 7. 暗影煙（暗影・傳說）：身後、腳邊冒出的大顆軟邊煙團（暗紫身＋上緣亮紫邊），一邊升一邊膨脹變淡
//    ＋腳下一灘會呼吸的暗影＋飄起的淡紫光點（傳說多的一件）。煙團 14＋光點 8＋地面件 2＝24
// =====================================================================
function makeSmoke(root) {
  const puffTex = (dark, rim) => canvasTex(128, 128, (g) => {
    const blob = (x, y, r, col, a) => { const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(0.62, `rgba(${col},${a * 0.85})`); gr.addColorStop(1, `rgba(${col},0)`);
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); };
    const C = [[64, 74, 38], [40, 68, 27], [88, 66, 29], [62, 46, 30]];
    C.forEach(([x, y, r]) => blob(x, y - 6, r + 4, rim, 0.9));              // 上緣亮邊
    C.forEach(([x, y, r]) => blob(x, y + 3, r, dark, 0.96));
  });
  const texA = puffTex('34,20,54', '155,92,255'), texB = puffTex('52,30,84', '226,212,255');
  const puffs = [...Array(14)].map((_, i) => { const s = new THREE.Sprite(spriteMat(i % 3 ? texA : texB)); root.add(s); return s; });
  const moteTex = glowTex('226,212,255', 1);
  const motes = [...Array(8)].map(() => { const s = new THREE.Sprite(spriteMat(moteTex)); root.add(s); return s; });
  const pool = canvasTex(256, 256, (g) => {
    g.translate(128, 128); g.beginPath();
    for (let k = 0; k <= 36; k++) { const a = k / 36 * Math.PI * 2, r = 100 * (1 + 0.1 * Math.sin(a * 3) + 0.07 * Math.sin(a * 5 + 1));
      g.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    g.closePath(); g.shadowColor = '#9B5CFF'; g.shadowBlur = 18; g.fillStyle = 'rgba(20,12,32,0.92)'; g.fill();
    g.shadowBlur = 0; g.lineWidth = 4; g.strokeStyle = 'rgba(155,92,255,0.85)'; g.stroke();
  });
  const glow = groundPlane(2.0, glowTex('155,92,255', 0.45), 0.004), puddle = groundPlane(1.55, pool, 0.008);
  root.add(glow, puddle);

  return (t) => {
    puffs.forEach((s, i) => {
      const u = t * 0.2 + h(i + 400), k = Math.floor(u), ph = u - k;      // 5 秒一顆
      const feet = i % 4 === 0, sx = h(k * 3 + i + 401) - 0.5, v = 0.85 + 0.3 * h(i + 405);
      if (feet) s.position.set(sx * 1.2 + Math.sign(sx) * 0.15 * ph, 0.06 + ph * 0.3, 0.15 + 0.2 * h(k * 5 + i + 402));
      else s.position.set(sx * 0.9 + Math.sin(t * 0.8 + i) * 0.06, 0.1 + ph * (1.35 + 0.4 * h(i + 403)), -0.2 - 0.3 * h(k * 5 + i + 402));
      s.scale.setScalar(((feet ? 0.4 : 0.5) + (feet ? 0.45 : 0.9) * ph) * v);
      s.material.rotation = (h(i + 404) - 0.5) * 2 + t * 0.12 * (i % 2 ? 1 : -1);
      s.material.opacity = Math.min(1, ph / 0.12) * (1 - ph);
    });
    motes.forEach((s, i) => {
      const ph = frac(t * 0.35 + h(i + 420)), a = i * GOLDEN, r = 0.3 + 0.4 * h(i + 421);
      s.position.set(Math.cos(a) * r + Math.sin(t * 2 + i) * 0.05, 0.05 + ph * 1.5, Math.sin(a) * r);
      s.scale.setScalar(0.06); s.material.opacity = Math.sin(Math.PI * ph) * 0.9;
    });
    puddle.rotation.z = t * 0.1; puddle.scale.setScalar(1 + 0.04 * Math.sin(t * 1.3));
    glow.material.opacity = 0.6 + 0.15 * Math.sin(t * 1.3);
  };
}

// =====================================================================
// 8. 全像掃描（鈦甲・傳說）：水平光環從腳掃到頭（下方拖一段有掃描線的光幕圓筒）
//    ＋環繞全身浮著的六角格，光環掃過時亮起再慢慢暗（傳說多的一層）＋光環邊緣甩出的資料小方塊
//    光環 1＋光幕網格 1＋六角格 14＋小方塊 8
// =====================================================================
function makeScan(root) {
  const TL = '#31F2D4', rgb = '49,242,212';
  const ringTex = canvasTex(256, 256, (g) => {
    g.translate(128, 128); g.strokeStyle = TL; g.fillStyle = TL; g.shadowColor = TL; g.shadowBlur = 12;
    g.lineWidth = 7; g.beginPath(); g.arc(0, 0, 112, 0, Math.PI * 2); g.stroke();
    g.lineWidth = 3; g.globalAlpha = 0.7; g.setLineDash([10, 8]); g.beginPath(); g.arc(0, 0, 98, 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
    g.globalAlpha = 1; for (let k = 0; k < 12; k++) { g.save(); g.rotate(k * Math.PI / 6); g.fillRect(-3, -126, 6, 12); g.restore(); }
  });
  const ring = groundPlane(1.4, ringTex); root.add(ring);
  const bandTex = canvasTex(8, 128, (g, w, hh) => {
    const gr = g.createLinearGradient(0, 0, 0, hh); gr.addColorStop(0, `rgba(${rgb},0.55)`); gr.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, w, hh);
    g.globalCompositeOperation = 'destination-out'; g.fillStyle = 'rgba(0,0,0,0.65)';
    for (let y = 0; y < hh; y += 8) g.fillRect(0, y + 5, w, 3);                // 掃描線
  });
  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.615, 0.615, 0.55, 40, 1, true),
    new THREE.MeshBasicMaterial({ map: bandTex, transparent: true, depthWrite: false, side: THREE.DoubleSide }));
  root.add(band);
  const hexTex = canvasTex(64, 64, (g) => {
    const hex = r => { g.beginPath(); for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3 - Math.PI / 2; g.lineTo(32 + Math.cos(a) * r, 32 + Math.sin(a) * r); } g.closePath(); };
    g.shadowColor = TL; g.shadowBlur = 6; hex(26); g.fillStyle = `rgba(${rgb},0.18)`; g.fill(); g.strokeStyle = TL; g.lineWidth = 3.5; g.stroke();
    hex(10); g.lineWidth = 2; g.stroke();
  });
  const hexes = [...Array(14)].map(() => { const s = new THREE.Sprite(spriteMat(hexTex)); root.add(s); return s; });
  const bitTex = canvasTex(16, 16, (g) => { g.fillStyle = '#C8FFF6'; g.shadowColor = TL; g.shadowBlur = 4; g.fillRect(3, 3, 10, 10); });
  const bits = [...Array(8)].map(() => { const s = new THREE.Sprite(spriteMat(bitTex)); root.add(s); return s; });

  return (t) => {
    const ph = frac(t * 0.42), y = 0.03 + 1.9 * ph;                           // 約 2.4 秒掃一趟
    const op = Math.min(1, ph / 0.06, (1 - ph) / 0.1), grow = Math.min(1, ph / 0.15);
    ring.position.y = y; ring.material.opacity = op;
    band.scale.y = Math.max(0.01, grow); band.position.y = y - 0.275 * grow; band.material.opacity = op * 0.9;
    hexes.forEach((s, i) => {
      const a = i * GOLDEN + 0.3, yy = 0.18 + 1.55 * frac(i * 0.618 + 0.2) + 0.03 * Math.sin(t * 1.6 + i);
      s.position.set(Math.cos(a) * 0.8, yy, Math.sin(a) * 0.8);
      const d = y - yy, lit = d > 0 ? Math.exp(-d / 0.35) : Math.exp(-((d / 0.08) ** 2));  // 掃過亮起、慢慢暗
      s.scale.setScalar(0.14 + 0.06 * lit); s.material.opacity = 0.2 + 0.8 * lit * op;
    });
    bits.forEach((s, j) => {
      const a = j / 8 * Math.PI * 2 + h(j + 510) * 0.5 + t * 0.5, life = frac(t * 1.6 + h(j + 520)), r = 0.62 + 0.25 * life;
      s.position.set(Math.cos(a) * r, y + 0.04 - 0.12 * life, Math.sin(a) * r);
      s.scale.setScalar(0.035); s.material.opacity = (1 - life) * op;
    });
  };
}

// =====================================================================
// 9. 聖光（曙光・傳說）：從頸後放出的放射狀光束扇形（長短交錯、金白兩色，整把慢慢轉，轉到扇緣淡出）
//    ＋身後暖光＋頭頂光環（傳說多的一件）＋往上飄的光點。光束 12＋暖光 1＋光環 1（平面）＋光環暈 1＋光點 8＝23
// =====================================================================
function makeRays(root) {
  const beamTex = (rgb, core) => canvasTex(64, 256, (g, w, hh) => {
    const wedge = (col, top, a0) => { const gr = g.createLinearGradient(0, hh, 0, 0);     // 底窄頂寬的楔形，往外漸淡
      gr.addColorStop(0, `rgba(${col},${a0})`); gr.addColorStop(0.6, `rgba(${col},${a0 * 0.75})`); gr.addColorStop(1, `rgba(${col},0)`);
      g.fillStyle = gr; g.beginPath(); g.moveTo(w / 2 - 3, hh); g.lineTo(w / 2 - top, 0); g.lineTo(w / 2 + top, 0); g.lineTo(w / 2 + 3, hh); g.closePath(); g.fill(); };
    wedge(rgb, 30, 0.9); if (core) wedge('255,255,255', 10, 0.8);
  });
  const texG = beamTex('255,196,50', true), texW = beamTex('255,234,160', false);
  const C = [0, 1.22, -0.42];
  const back = new THREE.Sprite(spriteMat(glowTex('255,226,140', 0.7))); back.position.set(C[0], C[1], C[2] - 0.03); back.scale.set(1.5, 1.5, 1); root.add(back);
  const beams = [...Array(12)].map((_, i) => { const s = new THREE.Sprite(spriteMat(i % 2 ? texW : texG)); s.center.set(0.5, 0); s.position.set(...C); root.add(s); return s; });
  const haloTex = canvasTex(256, 256, (g) => {
    g.translate(128, 128); const arc = (col, w) => { g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.arc(0, 0, 100, 0, Math.PI * 2); g.stroke(); };
    arc('#8A5A00', 30); arc('#F5C542', 20); arc('#FFF2B0', 6);
    g.fillStyle = '#FFFFFF'; for (let k = 0; k < 8; k++) { g.save(); g.rotate(k * Math.PI / 4); g.translate(0, -100); g.rotate(Math.PI / 4); g.fillRect(-6, -6, 12, 12); g.restore(); }
  });
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.6), groundMat(haloTex)); halo.renderOrder = 1; root.add(halo);
  const haloGlow = new THREE.Sprite(spriteMat(glowTex('255,212,92', 0.6))); haloGlow.scale.set(0.8, 0.5, 1); root.add(haloGlow);
  const moteTex = glowTex('255,240,190', 1);
  const motes = [...Array(8)].map(() => { const s = new THREE.Sprite(spriteMat(moteTex)); root.add(s); return s; });

  return (t) => {
    beams.forEach((s, i) => {
      const pos = frac(i / 12 + t * 0.025), ang = -0.35 + pos * (Math.PI + 0.7);    // 扇形 -20°～200°，約 40 秒轉一圈
      s.material.rotation = ang - Math.PI / 2;
      const len = (i % 2 ? 0.8 : 1.12) * (1 + 0.08 * Math.sin(t * 1.3 + i));
      s.scale.set(i % 2 ? 0.2 : 0.3, len, 1);
      s.material.opacity = Math.pow(Math.sin(Math.PI * pos), 0.8) * (0.8 + 0.15 * Math.sin(t * 1.7 + i * 2.1));
    });
    back.material.opacity = 0.35 + 0.08 * Math.sin(t * 1.5);
    const hy = 1.88 + 0.02 * Math.sin(t * 2);
    halo.position.set(0, hy, -0.02); halo.rotation.set(-Math.PI / 2 + 0.55, 0, t * 0.5);          // 往鏡頭傾斜：鏡頭比光環低，平放會只剩一條線
    haloGlow.position.set(0, hy, -0.03); haloGlow.material.opacity = 0.45 + 0.1 * Math.sin(t * 2.6);
    motes.forEach((s, i) => {
      const ph = frac(t * 0.3 + h(i + 600)), a = i * GOLDEN;
      s.position.set(Math.cos(a) * 0.55, 0.7 + ph * 1.3, -0.3 + Math.sin(a) * 0.2);
      s.scale.setScalar(0.06); s.material.opacity = Math.sin(Math.PI * ph) * 0.9;
    });
  };
}

// =====================================================================
// 10. 星塵（星界魔導・傳說）：斜的星環軌道上繞行的四芒星（粉、描邊、拖三顆星塵尾巴）＋軌道光帶
//     ＋反向斜的第二條小軌道（青色，傳說多的一件）＋身邊閃爍的小星。星 9＋尾巴 15＋閃星 6＋軌道光帶 2（平面）
// =====================================================================
function makeStars(root) {
  const PK = '#FF6BD6', CY = '#8FE3FF';
  const starTex = (fill, core) => canvasTex(64, 64, (g) => {
    g.translate(32, 32); const p = new Path2D();
    p.moveTo(0, -28); p.quadraticCurveTo(5, -5, 28, 0); p.quadraticCurveTo(5, 5, 0, 28); p.quadraticCurveTo(-5, 5, -28, 0); p.quadraticCurveTo(-5, -5, 0, -28);
    g.shadowColor = fill; g.shadowBlur = 8; g.fillStyle = fill; g.fill(p); g.shadowBlur = 0; g.lineWidth = 3; g.strokeStyle = '#2A1650'; g.stroke(p);
    g.scale(0.45, 0.45); g.fillStyle = core; g.fill(p);
  });
  const sPK = starTex(PK, '#FFE6F7'), sCY = starTex(CY, '#FFFFFF');
  const bandTex = rgb => canvasTex(256, 256, (g) => { g.translate(128, 128);
    g.strokeStyle = `rgba(${rgb},0.25)`; g.lineWidth = 14; g.beginPath(); g.arc(0, 0, 118, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = `rgba(${rgb},0.9)`; g.shadowColor = `rgb(${rgb})`; g.shadowBlur = 10; g.lineWidth = 4; g.beginPath(); g.arc(0, 0, 118, 0, Math.PI * 2); g.stroke(); });
  const orbit = (rx, rz, y) => { const o = new THREE.Group(); o.position.y = y; o.rotation.set(rx, 0, rz); root.add(o); return o; };
  const A = orbit(0.38, 0.32, 0.95), B = orbit(-0.5, -0.45, 1.2), RA = 0.69, RB = 0.553;
  A.add(groundPlane(1.5, bandTex('255,107,214'), 0)); B.add(groundPlane(1.2, bandTex('143,227,255'), 0));
  const sp = (tex, parent) => { const s = new THREE.Sprite(spriteMat(tex)); parent.add(s); return s; };
  const big = [...Array(5)].map(() => sp(sPK, A));
  const trailTex = glowTex('255,150,230', 1);
  const trails = [...Array(15)].map(() => sp(trailTex, A));
  const small = [...Array(4)].map(() => sp(sCY, B));
  const twinkle = [...Array(6)].map((_, j) => sp(j % 2 ? sPK : sCY, root));

  return (t) => {
    big.forEach((s, i) => {
      const th = i / 5 * Math.PI * 2 + t * 0.8;
      s.position.set(Math.cos(th) * RA, 0, Math.sin(th) * RA);
      s.scale.setScalar(0.15 + 0.03 * Math.sin(t * 4 + i)); s.material.rotation = t * 0.8 + i;
      for (let k = 1; k <= 3; k++) { const tr = trails[i * 3 + k - 1], a = th - k * 0.13;
        tr.position.set(Math.cos(a) * RA, 0, Math.sin(a) * RA); tr.scale.setScalar(0.08 * (1 - k * 0.22)); tr.material.opacity = 0.8 * (1 - k * 0.28); }
    });
    small.forEach((s, i) => {
      const th = -(i / 4 * Math.PI * 2 + t * 1.1);
      s.position.set(Math.cos(th) * RB, 0, Math.sin(th) * RB); s.scale.setScalar(0.1); s.material.rotation = -t + i;
    });
    twinkle.forEach((s, j) => {
      const a = j * GOLDEN + 1, r = 0.5 + 0.4 * h(j + 700), o = Math.pow(Math.max(0, Math.sin(t * 2 + j * 2.2)), 3);
      s.position.set(Math.cos(a) * r, 0.2 + 1.6 * h(j + 701), Math.sin(a) * r);
      s.scale.setScalar(0.04 + 0.07 * o); s.material.opacity = o;
    });
  };
}

const BIG = [300, 340], SMALL = [88, 100];
const grid = document.getElementById('grid');

  camera.position.set(0, 1.2, 4.6); camera.lookAt(0, 0.8, 0);

  const el = renderer.domElement;
  el.addEventListener('pointerdown', e => { drag = e.clientX; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => { if (drag == null) return; spin += (e.clientX - drag) * 0.01; drag = e.clientX; });
  el.addEventListener('pointerup', () => drag = null);
  const resize = ([w, hh]) => renderer.setSize(w, hh);
  resize(BIG);
  return { def, card, renderer, scene, camera, holder, body, update, resize, getSpin: () => spin };

// ---------- 控制 ----------
let t = 0, playing = true, still = false, last = performance.now();
const $ = id => document.getElementById(id);
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '暫停' : '播放'; };
$('t').oninput = e => { t = +e.target.value; playing = false; still = false; $('play').textContent = '播放'; $('still').classList.remove('on'); };
$('still').onclick = () => { still = !still; $('still').classList.toggle('on', still); };
$('gray').onchange = e => document.body.classList.toggle('gray', e.target.checked);
$('small').onchange = e => panels.forEach(p => p.resize(e.target.checked ? SMALL : BIG));
document.querySelectorAll('#filter button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#filter button').forEach(x => x.classList.toggle('on', x === b));
  const f = b.dataset.f;
  panels.forEach(p => p.card.style.display = f === 'all' || (f === 'new') === !!p.def.fresh ? '' : 'none');
});

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing && !still) t = (t + dt) % 8;
  $('t').value = t; $('tl').textContent = still ? '定格' : `t = ${t.toFixed(2)}`;
  for (const p of panels) {
    if (p.card.style.display === 'none') continue;
    const tt = still ? p.def.still : t;
    p.holder.rotation.y = -0.5 + p.getSpin();
    p.body.userData.torso.scale.y = 1 + 0.015 * Math.sin(tt * 2.2);
    p.update(tt);
    p.renderer.render(p.scene, p.camera);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__fx = { setT: v => { t = v; playing = false; }, panels };
