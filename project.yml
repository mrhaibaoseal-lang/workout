name: Workout
options:
  bundleIdPrefix: com.mrhaibaoseal
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: "17.0"
packages:
  # 動畫／特效工具（0.31.x 加入，見 docs/art-tools.md）
  Vortex:
    url: https://github.com/twostraws/Vortex
    from: 1.0.5
  EffectsLibrary:
    url: https://github.com/GetStream/effects-library
    from: 1.0.0
  Pow:
    url: https://github.com/EmergeTools/Pow
    from: 0.3.1
  Lottie:
    url: https://github.com/airbnb/lottie-spm
    from: 4.6.1
  RiveRuntime:
    url: https://github.com/rive-app/rive-ios
    from: 6.30.1
settings:
  base:
    MARKETING_VERSION: "0.32.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Workout:
    type: application
    platform: iOS
    sources: [Workout, Shared]
    scheme:
      testTargets: [WorkoutTests]
    dependencies:
      - target: WorkoutWidget
      - package: Vortex
      - package: EffectsLibrary
      - package: Pow
      - package: Lottie
      - package: RiveRuntime
    entitlements:
      path: Workout/Workout.entitlements
      properties:
        com.apple.security.application-groups: [group.81c139ae9a27a7f8.1]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrhaibaoseal.workout
        # 教練講評用的 Apple Intelligence（iOS 26 起才有），弱連結讓 iOS 17–25 也能開
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "FoundationModels"]
        ASSETCOMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 練壯
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: 練壯會讀取行事曆裡的活動，自動避開有事的時間來排訓練。

  WorkoutTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WorkoutTests]
    dependencies:
      - target: Workout
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mrhaibaoseal.workout.tests

  WorkoutWidget:
    type: app-extension
    platform: iOS
    sources: [WorkoutWidget, Shared]
    info:
      path: WorkoutWidget/Info.plist
      properties:
        CFBundleDisplayName: 練壯
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WorkoutWidget/WorkoutWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.81c139ae9a27a7f8.1]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrhaibaoseal.workout.widget
        SKIP_INSTALL: YES
