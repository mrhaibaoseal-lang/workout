name: Build iOS

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 or newer
        run: |
          # 教練講評要 FoundationModels，需要 Xcode 26 以上的 SDK
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_[0-9]*.app | grep -iv beta | sed -E 's#.*/Xcode_([0-9.]+)\.app#\1 &#' | sort -V | tail -1 | cut -d' ' -f2)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          MAJOR=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          [ "$MAJOR" -ge 26 ] || { echo "::error::需要 Xcode 26 以上，目前是 $MAJOR"; exit 1; }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Workout.xcodeproj \
            -scheme Workout \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Workout.app Payload/
          # Ad-hoc sign so the App Group entitlement travels with the IPA;
          # the sideloading tool re-signs with the user's Apple ID.
          codesign -f -s - --entitlements WorkoutWidget/WorkoutWidget.entitlements Payload/Workout.app/PlugIns/WorkoutWidget.appex
          codesign -f -s - --entitlements Workout/Workout.entitlements Payload/Workout.app
          ls Payload/Workout.app/PlugIns
          # FoundationModels 必須是弱連結，否則 iOS 26 以前的系統一開就閃退
          otool -l Payload/Workout.app/Workout | grep -B1 -A3 FoundationModels || true
          if otool -l Payload/Workout.app/Workout | grep -B2 FoundationModels | grep -q "cmd LC_LOAD_DYLIB"; then
            echo "::error::FoundationModels 不是弱連結"; exit 1
          fi
          zip -qry Workout.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Workout-ipa
          path: Workout.ipa

      - name: Publish to private Feather source
        uses: mrhaibaoseal-lang/feather-source@main
        with:
          ipa: Workout.ipa
          icon: Workout/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          description: 在家用自己的器材練壯。每週 4 天課表、自動加重建議、60/20 分鐘與「只做 1 組」模式、練習提醒。
