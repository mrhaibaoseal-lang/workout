name: Build iOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Workout.xcodeproj \
            -scheme Workout \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Workout.app Payload/
          # Ad-hoc sign so the App Group entitlement travels with the IPA;
          # the sideloading tool re-signs with the user's Apple ID.
          codesign -f -s - --entitlements WorkoutWidget/WorkoutWidget.entitlements Payload/Workout.app/PlugIns/WorkoutWidget.appex
          codesign -f -s - --entitlements Workout/Workout.entitlements Payload/Workout.app
          ls Payload/Workout.app/PlugIns
          zip -qry Workout.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Workout-ipa
          path: Workout.ipa
